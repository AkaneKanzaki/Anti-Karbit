<div class="stat-grid" id="stat-cards-grid">
  <div class="stat">
    <span class="stat-label">Detected</span>
    <span class="stat-value" id="stat-detected">{{ detected }}</span>
  </div>
  <div class="stat">
    <span class="stat-label">Claimed</span>
    <span class="stat-value" id="stat-claimed">{{ claimed }}</span>
  </div>
  <div class="stat">
    <span class="stat-label">Failed</span>
    <span class="stat-value" id="stat-failed">{{ failed }}</span>
  </div>
  <div class="stat">
    <span class="stat-label">Success rate</span>
    <span class="stat-value" id="stat-success-rate">{{ success_rate }}%</span>
  </div>
  <div class="stat">
    <span class="stat-label">Memory</span>
    <span class="stat-value" id="sys-ram">{{ memory_mb }} MB</span>
  </div>
</div>
